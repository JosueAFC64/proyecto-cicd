name: CI/CD Pipeline - Calculadora

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Análisis estático (lint)
        run: flake8 app.py --max-line-length=100

      - name: Verificar que la app compila/importa correctamente
        run: python -c "import app; print('Build OK')"

  test:
    name: 2. Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias con cobertura
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    name: 3. Deploy (simulado)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Empaquetar aplicación
        run: |
          mkdir -p dist
          cp app.py dist/
          cp requirements.txt dist/
          tar -czf dist/calculadora-${{ github.sha }}.tar.gz -C dist app.py requirements.txt
          echo "Paquete generado: calculadora-${{ github.sha }}.tar.gz"

      - name: Desplegar (simulación)
        run: |
          echo "Conectando al entorno de producción..."
          echo "Subiendo artefacto calculadora-${{ github.sha }}.tar.gz"
          echo "Reiniciando servicio..."
          echo "Despliegue completado exitosamente en $(date)"

      - name: Guardar artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: paquete-despliegue
          path: dist/*.tar.gz
